<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Jey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; 
            color: #fff;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header - Fixed at 84px */
        header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 0 5%;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 84px; 
        }
        
        /* Logo Style - Inangat nang kaunti gamit ang negative top */
        .logo {
            height: 85px; 
            width: auto;
            display: block;
            mix-blend-mode: screen; 
            filter: brightness(1.1);
            position: relative;
            top: -3px; /* Mula 4px, ginawa nating -5px para umangat */
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('../assets/images/jey1.jpg') no-repeat center 30%/cover;
            height: calc(100vh - 84px); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }
        
        .hero h2 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        .hero p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 40px;
            background-color: #e50914;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }
        .btn:hover {
            background-color: #b80710;
            transform: scale(1.05);
        }

        footer {
            background-color: transparent; 
            color: #ccc; 
            text-align: center;
            padding: 15px;
            position: absolute; 
            bottom: 0;
            width: 100%;
            z-index: 10;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>  

    <header>
        <img src="../assets/images/jey_logo.jpg" alt="Capital Jey Logo" class="logo">
    </header>

    <section class="hero">
        <h2>Find Your Dream Ride</h2>
        <p>Explore our premium selection of top-quality vehicles.</p>
        <a href="home.php" class="btn">CONTINUE</a>
    </section>

</body>
</html>
